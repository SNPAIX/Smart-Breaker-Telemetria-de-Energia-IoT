[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=app --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",   # Permite Depends() y Query() de FastAPI
    "EXE002", # El bit de ejecutable no es fiable en un bind-mount desde Windows;
              # el modo real que importa es el que trackea git (100644), no el
              # que reporta el filesystem del host durante desarrollo local.
    "BLE001", # `except Exception` intencional: enviar por un WebSocket sin que
              # un cliente muerto tumbe el envío a los demás (ws_manager.py), y
              # verificar en tests el cierre de conexión que Starlette expone
              # sin un tipo de excepción único y estable entre versiones.
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false