services:
  db:
    image: postgres:15-alpine
    container_name: voltguard_db
    environment:
      POSTGRES_USER: voltguard_user
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: voltguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltguard_user -d voltguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: voltguard_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://voltguard_user:supersecretpassword@db:5432/voltguard_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: