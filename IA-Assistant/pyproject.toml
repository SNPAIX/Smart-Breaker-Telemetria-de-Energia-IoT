[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-assistant"
version = "0.1.0"
description = "Interpretación de comandos de voz para VoltGuard — módulo aislado."
requires-python = ">=3.11"
dependencies = [
    "rapidfuzz>=3.9,<4.0",
    "mypy-extensions>=1.0,<2.0",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.2.90,<0.3"]

[tool.setuptools.packages.find]
include = ["ia_assistant*"]
